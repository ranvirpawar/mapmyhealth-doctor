<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Map My Health - Doctor Portal</title>
    <script type="text/javascript">
      // This is a SPA (Single Page Application), so redirect all 404 requests to index.html
      var segmentCount = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        '/mapmyhealth-doctor/?p=' + l.pathname.slice(1).split('/').slice(segmentCount).join('/')
          .replace(/&/g, '~and~') + (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        (l.hash)
      );
    </script>
  </head>
  <body>
  </body>
</html>
